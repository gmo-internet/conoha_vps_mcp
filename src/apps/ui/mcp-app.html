<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConoHa VPS Storage — MCP App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#00c9e3;--cyan-lt:#e6f7fb;--cyan-dk:#00a5c4;
  --bg:#f5f7f8;--bg2:#edf0f2;
  --white:#ffffff;
  --text:#000;--text2:#505659;--text3:#aeb4b8;
  --border:#e6e9eb;--border2:#aeb4b8;
  --red:#e53e3e;--red-lt:#fff5f5;
  --green:#38a169;--green-lt:#f0fff4;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans JP',sans-serif;
  --radius:6px;
  --sh:0 2px 10px rgba(0,0,0,.04);
}
body{background:var(--bg);font-family:var(--sans);color:var(--text);height:600px;display:flex;flex-direction:column;overflow:hidden}

/* ヘッダーバー */
.header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--cyan)}
.header-icon{width:20px;height:20px;background:rgba(255,255,255,.25);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.header-title{color:#fff;font-family:var(--mono);font-size:12px;font-weight:500}
.header-sep{color:rgba(255,255,255,.5)}
.header-page{color:rgba(255,255,255,.85);font-family:var(--mono);font-size:11px}
.header-sp{flex:1}
.header-badge{background:rgba(255,255,255,.2);color:#fff;border-radius:100vmax;padding:2px 10px;font-size:10px;font-family:var(--mono);border:1px solid rgba(255,255,255,.3)}

/* メインコンテナ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ナビゲーション */
.nav{display:flex;align-items:center;padding:10px 16px;gap:8px;background:var(--white);border-bottom:1px solid var(--border)}
.nav-btn{padding:6px 14px;border-radius:var(--radius);font-size:12px;font-family:var(--mono);font-weight:500;color:var(--text2);border:1px solid var(--border);background:var(--white);cursor:pointer;transition:all .15s}
.nav-btn:hover{border-color:var(--border2);color:var(--text)}
.nav-btn.on{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.nav-sp{flex:1}

/* ストレージ（コンテナ一覧） */
.storage-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border)}
.storage-summary{display:flex;align-items:baseline;gap:8px}
.storage-label{font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.storage-count{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text)}
.btn-sm{padding:6px 12px;font-size:11px}
.container-list{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-content:start}
.container-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .18s ease;position:relative;overflow:hidden}
.container-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--cyan);opacity:0;transition:opacity .18s}
.container-card:hover{border-color:var(--cyan);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,201,227,.12)}
.container-card:hover::before{opacity:1}
.container-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.container-icon{width:28px;height:28px;border-radius:6px;background:var(--cyan-lt);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.container-name{flex:1;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.container-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.container-card:hover .container-actions{opacity:1}
.container-action{padding:4px 8px;font-size:10px;font-family:var(--mono);border:1px solid var(--border);background:var(--white);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .12s}
.container-action:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.container-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);padding:8px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border)}
.container-stat-key{color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.container-stat-val{color:var(--text);font-size:12px;font-weight:500}
.container-meta{margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--text3)}
.storage-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
.empty-desc{font-family:var(--mono);font-size:11px;color:var(--text3)}

/* オブジェクト一覧（コンテナ詳細） */
.back-link{padding:4px 10px;font-family:var(--mono);font-size:11px;color:var(--cyan-dk);background:transparent;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;transition:all .15s;margin-right:4px}
.back-link:hover{background:var(--cyan-lt);border-color:var(--cyan)}
.container-bc-icon{font-size:14px}
.container-bc-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-controls{display:flex;align-items:center;gap:8px}
.upload-progress{padding:6px 16px;background:var(--cyan-lt);border-bottom:1px solid var(--cyan);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--cyan-dk);position:relative;overflow:hidden}
.upload-progress::before{content:"";position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan) 50%,transparent);animation:shimmer 1.4s linear infinite;opacity:.3}
@keyframes shimmer{0%{left:-30%}100%{left:130%}}
.progress-label{position:relative;z-index:1}
.object-list{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px}
.object-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:10px 12px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);margin-top:8px;transition:all .15s}
.object-row:hover{border-color:var(--cyan);box-shadow:0 2px 8px rgba(0,201,227,.08)}
.object-icon{font-size:16px;text-align:center}
.object-name-block{display:flex;flex-direction:column;gap:3px;min-width:0}
.object-name{font-family:var(--mono);font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.object-mime{font-family:var(--mono);font-size:10px;color:var(--cyan-dk);background:var(--cyan-lt);padding:1px 7px;border-radius:100vmax;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.object-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;white-space:nowrap}
.object-size{font-family:var(--mono);font-size:11px;color:var(--text2);font-weight:500;white-space:nowrap}
.object-action{padding:4px 10px;font-size:10px;font-family:var(--mono);border:1px solid var(--border);background:var(--white);color:var(--text2);border-radius:4px;cursor:pointer;transition:all .12s}
.object-action:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}

/* フォーム（コンテナ作成） */
.form-panel{display:none;flex-direction:column;overflow-y:auto;min-height:0;flex:1}
.form-panel.open{display:flex}
.form-section{padding:16px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.form-label .req{color:var(--red);font-size:9px}
.form-input{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:13px;color:var(--text);background:var(--white);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--cyan)}
.form-input::placeholder{color:var(--text3)}
.form-hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.4}
.form-error{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:4px}

/* ボタン */
.btn-row{display:flex;gap:8px;padding:16px;background:var(--bg);border-top:1px solid var(--border);margin-top:auto}
.btn{padding:8px 20px;border-radius:var(--radius);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);transition:all .15s}
.btn-primary{background:var(--cyan);color:#fff;border-color:var(--cyan);box-shadow:0 2px 8px rgba(0,201,227,.25)}
.btn-primary:hover{background:var(--cyan-dk)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{background:var(--white);color:var(--text2)}
.btn-cancel:hover{background:var(--bg);color:var(--text)}

/* 確認ダイアログ */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-panel{background:var(--white);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.15);width:400px;max-width:90vw;padding:24px;text-align:center}
.confirm-title{font-weight:700;font-size:15px;margin-bottom:8px}
.confirm-body{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.confirm-body code{background:var(--bg2);padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:12px}
.confirm-btns{display:flex;gap:8px;justify-content:center}

/* 結果通知 */
.toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius);font-family:var(--mono);font-size:12px;color:#fff;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{display:block;animation:toast-in .3s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* フッター */
.footer{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;background:var(--bg);border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite;display:inline-block;margin-right:6px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">C</div>
  <span class="header-title">ConoHa VPS</span>
  <span class="header-sep">/</span>
  <span class="header-page" id="page-label">storage</span>
  <span class="header-sp"></span>
  <span class="header-badge">MCP App</span>
</div>

<div class="main">
  <div class="nav">
    <button type="button" class="nav-btn on" id="btn-storage">ストレージ</button>
    <span class="nav-sp"></span>
  </div>

  <!-- ストレージ（コンテナ一覧）パネル -->
  <div id="panel-storage" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div class="storage-bar">
      <div class="storage-summary">
        <span class="storage-label">コンテナ</span>
        <span class="storage-count" id="storage-count">—</span>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="btn-create-container">+ コンテナ作成</button>
    </div>
    <div class="container-list" id="container-list"></div>
  </div>

  <!-- オブジェクト一覧パネル（コンテナ詳細） -->
  <div id="panel-objects" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div class="storage-bar">
      <div class="storage-summary">
        <button type="button" class="back-link" id="btn-back-to-containers" title="コンテナ一覧へ戻る">← 戻る</button>
        <span class="container-bc-icon">📦</span>
        <span class="container-bc-name" id="objects-container-name">—</span>
        <span class="storage-count" id="objects-count">—</span>
      </div>
      <div class="upload-controls">
        <input type="file" id="f-upload-file" hidden>
        <button type="button" class="btn btn-primary btn-sm" id="btn-upload-object">📤 ファイルをアップロード</button>
      </div>
    </div>
    <div class="upload-progress" id="upload-progress" style="display:none">
      <span class="progress-label" id="progress-label">アップロード中…</span>
    </div>
    <div class="object-list" id="object-list"></div>
  </div>

  <!-- コンテナ作成パネル -->
  <div class="form-panel" id="panel-create-container">
    <div class="form-section">
      <div class="form-group">
        <label class="form-label" for="f-container-name">コンテナ名 <span class="req">必須</span></label>
        <input type="text" class="form-input" id="f-container-name" placeholder="例: backups" maxlength="256" autocomplete="off">
        <span class="form-hint">英数字・ハイフン・アンダースコア・ピリオドのみ。スラッシュは不可。</span>
        <span class="form-error" id="f-container-error" style="display:none"></span>
      </div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-cancel" id="btn-create-container-cancel">キャンセル</button>
      <button type="button" class="btn btn-primary" id="btn-create-container-submit" disabled>コンテナを作成</button>
    </div>
  </div>
</div>

<!-- 確認ダイアログ -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-panel">
    <div class="confirm-title" id="confirm-title">削除しますか？</div>
    <div class="confirm-body" id="confirm-body"></div>
    <div class="confirm-btns">
      <button type="button" class="btn btn-cancel" id="confirm-cancel">キャンセル</button>
      <button type="button" class="btn btn-primary" id="confirm-ok">削除する</button>
    </div>
  </div>
</div>

<div class="footer">
  <span><span class="status-dot"></span>MCP App 接続中</span>
  <span>最終更新: <span id="last-update">—</span></span>
</div>

<script type="module" src="./mcp-app.ts"></script>
</body>
</html>
