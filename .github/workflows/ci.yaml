name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run docs build
        run: npm run docs:build

      - name: Run build
        run: npm run build

      # PR レビュー時に install 検証ができるよう、tarball を artifact として保管する
      - name: Pack tarball for review install
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 7
          if-no-files-found: error

  biome:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-biome-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run biome:ci

  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-typecheck-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test

      - name: Convert CSV to Markdown Table
        id: csv-to-markdown
        run: |
          node .github/scripts/csv-to-markdown.js

      - name: Parse coverage summary
        id: coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
            echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
            {
              echo "## Test Coverage Report"
              echo ""
              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| Lines | $(jq -r '.total.lines.pct' coverage/coverage-summary.json)% |"
              echo "| Functions | $(jq -r '.total.functions.pct' coverage/coverage-summary.json)% |"
              echo "| Branches | $(jq -r '.total.branches.pct' coverage/coverage-summary.json)% |"
              echo "| Statements | $(jq -r '.total.statements.pct' coverage/coverage-summary.json)% |"
              echo ""
              echo "📊 [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment test results and coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let comment = '';
            
            // Add test results report if available
            if (fs.existsSync('test-report.md')) {
              const testReport = fs.readFileSync('test-report.md', 'utf8');
              comment += testReport + '\n\n';
            }
            
            // Add coverage report if available
            if (fs.existsSync('reports/coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('reports/coverage/coverage-summary.json', 'utf8'));
              comment += `## 📊 Test Coverage Report
              
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${coverage.total.lines.pct}% |
              | Functions | ${coverage.total.functions.pct}% |
              | Branches | ${coverage.total.branches.pct}% |
              | Statements | ${coverage.total.statements.pct}% |
              
              <details>
              <summary>📁 File Coverage Details</summary>
              
              ${Object.entries(coverage).filter(([key]) => key !== 'total').map(([file, data]) => 
                `**${file}**: Lines ${data.lines.pct}% | Functions ${data.functions.pct}% | Branches ${data.branches.pct}% | Statements ${data.statements.pct}%`
              ).join('\n')}
              </details>`;
            }
            
            if (comment) {
              // Find existing test report or coverage comment
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const existingComment = comments.data.find(comment => 
                comment.body.includes('📊 Test Results Report') || comment.body.includes('📊 Test Coverage Report')
              );
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
                console.log('Updated existing test and coverage report comment');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
                console.log('Created new test and coverage report comment');
              }
            }

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-and-coverage-report
          path: |
            reports/coverage/test-result.csv
            test-report.md
          retention-days: 30

  knip:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-knip-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run knip
        run: npm run knip

  depcruise:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-depcruise-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run dependency-cruiser
        run: npm run depcruise

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-audit-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.17.0"
          cache: "npm"

      - name: Run security audit
        # devDeps（ビルド/テスト専用ツール、ランタイムにバンドルされない）の
        # 脆弱性は対象外。@anthropic-ai/mcpb 推移的依存の tmp 等 No fix available
        # な dev-only CVE で CI が落ちないようにする。
        run: npm audit --audit-level=high --omit=dev

  docker-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-docker-build-${{ github.ref }}
    steps:
      - name: Checkout files
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: false
          tags: conoha-vps-mcp:test
